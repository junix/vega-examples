<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20 自定义 Transform 与表达式函数 · vega-examples</title>
<link rel="stylesheet" href="../../assets/demo.css">
<script>
/* DEMO_META 会被 assets/demo.js 用来渲染统一页头（面包屑/标题/概念标签） */
window.DEMO_META = {
  slug: '20-custom-transform-expr',
  group: 'E. 运行时 API 与工程化',
  title: '20 · 自定义 Transform 与表达式函数：扩展 Vega 的两条正交途径',
  concepts: ['vega.Transform', 'vega.inherits', 'Definition 参数表', 'transforms 注册表', 'pulse.visit(ADD/SOURCE)', 'vega.expressionFunction', '注册必须先于 parse']
};
</script>
</head>
<body>
<main class="demo-main">
  <div class="demo-view">
    <div class="demo-notes">
      灰线：MSFT 原始收盘价（<code>spec.vg.json</code> 自带，纯内置语法）。
      红线：<b>自定义 Transform</b> <code>MovingAverage</code> 算出的滑动平均，
      窗口大小由 <code>maWindow</code> 滑块控制（拖动即触发参数变化 → 全量重算）。
      左上角注释里的百分比由<b>自定义表达式函数</b> <code>pctChange</code> 计算。
      两个扩展都在 <code>main.js</code> 里注册，且<b>必须先于</b> <code>vega.parse</code>。
    </div>
    <div id="view"></div>
  </div>
  <aside id="signals" class="demo-signals">
    <h2>Signals 实时值</h2>
    <table>
      <tr><td class="k">maWindow</td><td class="v">…</td></tr>
    </table>
    <div class="demo-notes">
      拖动图表下方的滑块改变滑动窗口，
      本面板由 <code>addSignalListener</code> 驱动。
    </div>
  </aside>
</main>
<script src="../../assets/vega.min.js"></script>
<script src="../../assets/demo.js"></script>
<script src="./main.js"></script>
</body>
</html>
