  slug: '41-matrix-adjacency',
  group: 'F. 稀有与复杂图形',
  title: '41 · 邻接矩阵：signal 驱动行列顺序的网络矩阵视图',
  concepts: [
    'format.property',
    'data.source 数组合并',
    'transform: formula 镜像边表',
    'transform: aggregate 求度数',

<body>
<main class="demo-main">
  <div class="demo-view">
    <div class="demo-notes">
      切换 <code>orderBy</code> 下拉框：同一份数据、同一批格子，只改行列顺序，
      「一团噪点」和「沿对角线的社群方块」之间来回切换 —— 这就是邻接矩阵的核心结论：
      <b>矩阵的可读性完全取决于行列顺序</b>。把鼠标移到格子或行列标签上会十字高亮整行整列；
      <code>colorBy</code> 切换「权重」/「是否同社群」两种语义，<code>encodeSize</code>
      让格子边长也编码权重，<code>labelMinDegree</code> 控制标签密度。
    </div>
    <div id="view"></div>
  </div>
  <aside id="signals"></aside>
</main>
