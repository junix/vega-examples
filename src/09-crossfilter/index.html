<body>
<main class="demo-main">
  <div class="demo-view">
    <div class="demo-notes">
      在任意直方图上<strong>按住拖动</strong>刷选一个区间，其余两图会按「满足所有刷选条件」的子集重算分布；
      <strong>双击</strong>某张图重置该维度的刷选。灰色柱是全集背景（不变），蓝色柱是当前子集，黄色半透明框是各图自己的刷选区间。
      刷选时注意看右侧 Signals 面板里 <code>delayRange / hourRange / distRange</code> 的实时变化。
    </div>
    <div id="view"></div>
  </div>
  <aside id="signals"></aside>
