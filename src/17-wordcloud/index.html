<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17 词云布局 · vega-examples</title>
<link rel="stylesheet" href="../../assets/demo.css">
<script>
/* DEMO_META 会被 assets/demo.js 用来渲染统一页头（面包屑/标题/概念标签） */
window.DEMO_META = {
  slug: '17-wordcloud',
  group: 'D. 高级布局与扩展',
  title: '17 · 词云：wordcloud 变换与文字布局回写',
  concepts: ['transform: wordcloud', 'mark: text', 'data.values', 'signal: bind', 'scale: ordinal', 'legend: 类别图例', '布局字段回写']
};
</script>
</head>
<body>
<main class="demo-main">
  <div class="demo-view">
    <div class="demo-notes">
      拖动图表下方的 <code>wordPadding</code> / <code>maxFont</code> 滑杆：词之间的间距与最大字号是
      <strong>signal 驱动的 wordcloud 变换参数</strong>，改动后布局会整体重排。
      间距 signal 特意<strong>不</strong>叫 <code>padding</code> —— 那是 Vega 内建的画布外边距 signal，
      同名会被合并顶替，连带把整张图的外边距一起改掉。
      悬停到单词上可看到 <code>hover</code> 编码集的半透明效果；颜色按概念类别
      （grammar / transform / layout / interaction / runtime）经 ordinal 比例尺映射，
      对应关系见图下方的 <strong>图例</strong>。
    </div>
    <div id="view"></div>
  </div>
  <aside id="signals"></aside>
</main>
<script src="../../assets/vega.min.js"></script>
<script src="../../assets/demo.js"></script>
<script src="./main.js"></script>
</body>
</html>
